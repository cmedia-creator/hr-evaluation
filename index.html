<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人事評価システム</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <section id="loginView" class="login-card card">
      <div class="brand">
        <span class="eyebrow">HR EVALUATION</span>
        <h1>人事評価システム</h1>
        <p>評価者IDとパスワードを入力してください。</p>
      </div>

      <form id="loginForm" class="stack">
        <label>
          評価者ID
          <input id="loginId" type="text" autocomplete="username" placeholder="EV0001" required />
        </label>

        <label>
          パスワード
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </label>

        <button type="submit" class="primary">ログイン</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section id="appView" class="hidden">
      <header class="topbar">
        <div>
          <span class="eyebrow">HR EVALUATION</span>
          <h1>評価入力</h1>
        </div>
        <div class="topbar-actions">
          <span id="evaluatorName" class="user-chip"></span>
          <button id="logoutButton" class="ghost">ログアウト</button>
        </div>
      </header>

      <section class="employee-card card">
        <div>
          <span class="eyebrow">評価対象</span>
          <h2 id="employeeName">-</h2>
          <p id="employeeMeta">-</p>
        </div>
        <div class="employee-status">
          <span id="statusBadge" class="status-badge">下書き</span>
        </div>
      </section>

      <section class="summary-card card">
        <div>
          <span class="eyebrow">評価シート</span>
          <h2 id="templateName">-</h2>
          <p id="templateMeta">-</p>
        </div>

        <div class="score-summary">
          <span>加重点数</span>
          <strong><span id="weightedScore">0.0</span><small> / 100</small></strong>
          <div class="score-bar">
            <span id="scoreBar"></span>
          </div>
        </div>
      </section>

      <div class="sticky-progress">
        <div>
          <strong id="progressText">0 / 0 項目</strong>
          <span>入力済み</span>
        </div>
        <div class="progress-actions">
          <button id="saveButtonTop" type="button" class="secondary">一時保存</button>
          <button id="submitButtonTop" type="button" class="primary">評価を確定</button>
        </div>
      </div>

      <form id="evaluationForm">
        <div id="sectionsContainer"></div>

        <section class="card comment-card">
          <span class="eyebrow">COMMENT</span>
          <h2>総合コメント</h2>
          <label>
            評価コメント
            <textarea id="comment" rows="7" placeholder="評価コメントを入力"></textarea>
          </label>
        </section>

        <section class="card footer-actions">
          <p id="saveMessage" class="message" aria-live="polite"></p>
          <div class="actions">
            <button type="button" id="saveButton" class="secondary">一時保存</button>
            <button type="submit" id="submitButton" class="primary">評価を確定</button>
          </div>
        </section>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js"></script>
</body>
</html>
